<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>WoodMind CAM</title>
</head>
<body>
    <h2>WoodMind CAM</h2>

    <p id="pipe_name"></p>
    <p id="engine"></p>
    <p id="version"></p>
    <p id="connected_at"></p>
    <p id="uptime"></p>

    <script>
        window.app = {
            receive: function (res) {
                alert(JSON.stringify(res));
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            if (window.sketchup && window.sketchup.get_cached_connection) {
                window.sketchup.get_cached_connection();
            } else {
                alert('Bridge not found');
            }
        });
    </script>

</body>
</html>
