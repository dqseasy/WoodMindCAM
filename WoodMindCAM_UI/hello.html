<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WoodMind CAM</title>
</head>
<body>
    <h2>WoodMind CAM</h2>
    <p id="pipe_name"></p>
    <p id="engine"></p>
    <p id="version"></p>
    <p id="connected_at"></p>
    <p id="uptime"></p>

    <script>
        window.app = {
            receive: function (res) {
                console.log("Receive:", res);

                document.getElementById("pipe_name").textContent =
                    res.data.pipe_name || "";

                document.getElementById("engine").textContent =
                    res.data.engine || "";

                document.getElementById("version").textContent =
                    res.data.version || "";

                document.getElementById("connected_at").textContent =
                    res.data.connected_at || "";

                document.getElementById("uptime").textContent =
                    res.data.uptime_seconds || "";
            }
        };

        document.addEventListener("DOMContentLoaded", function () {
            if (window.sketchup && window.sketchup.ruby_ready) {
                window.sketchup.ruby_ready();
            }
        });
    </script>
</body>
</html>
